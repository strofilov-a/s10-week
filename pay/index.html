<!doctype html>
<html lang="ru" data-type="software" data-radius="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="page-type" content="software">
<meta name="site-kind" content="software">
<meta name="theme-color" content="#ffffff">
<title>Оплата Premium · S10.run</title>
<meta name="description" content="Premium на S10.run: 9 € в месяц картой через Stripe или 750 ₽ через Т-Банк.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&display=swap" rel="stylesheet">
<!--
  tasteskill deal (09.11.2026): kind software (a fintech checkout inside the s10.run app);
  palette white-link-blue «Sheet and biro» (a payment page wants a calm white sheet and one trusted blue);
  type onest (Cyrillic-first neo-grotesk); radius soft; one effect: orb-sphere on the Premium card;
  moment: the card enters on load. App screen: the marketing page rules (one section per screen) do not apply.
-->
<style>
:root {
  --p-bg: #ffffff; --p-surface: #f4f4f4; --p-ink: #111111; --p-muted: #595959; /* dealt #6b6b6b, darkened to 7:1 as on solo */
  --p-accent: #1a4be0; --p-accent-ink: #ffffff; --p-action: #1a4be0; --p-action-ink: #ffffff;
  --p-inv-bg: #111111; --p-inv-surface: #1e1e1e; --p-inv-ink: #ffffff; --p-inv-muted: #9a9a9a;
  --font-display: "Onest", system-ui, sans-serif;
  --font-text: "Onest", system-ui, sans-serif;
  --display-weight: 400;
  --display-tracking: -0.035em;

  --line: #e7e7e9;
  --line-strong: #d6d6da;
  --accent-soft: #eef2fd;
  --deep: #0a1a52;          /* the card's field: the accent's deep tone */
  --ok: #17784a;
  --r-s: 8px; --r-m: 12px; --r-l: 18px;
  --ease: cubic-bezier(.2,.7,.2,1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--p-bg); color: var(--p-ink);
  font: 400 15px/1.5 var(--font-text); font-feature-settings: "tnum" 1, "cv11" 1;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
.skip { position: absolute; left: 16px; top: -60px; background: var(--p-ink); color: #fff; padding: 10px 14px; border-radius: var(--r-s); z-index: 10; }
.skip:focus { top: 12px; }
:focus-visible { outline: 2px solid var(--p-accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line); }
@supports (backdrop-filter: blur(8px)) { .bar { background: rgba(255,255,255,.78); backdrop-filter: saturate(1.4) blur(12px); } }
.bar-in { max-width: 1160px; margin: 0 auto; padding: 0 32px; height: 60px; display: flex; align-items: center; gap: 16px; }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; text-decoration: none; color: var(--p-muted); font-size: 14px; border-radius: var(--r-s); padding: 0 6px; margin-left: -6px; transition: color .2s; }
.back:hover { color: var(--p-ink); }
.back svg { transition: transform .25s var(--ease); }
.back:hover svg { transform: translateX(-3px); }
.logo { display: block; width: 78px; height: 24px; }
.logo path[fill="white"] { fill: var(--p-ink); }
.bar .sp { flex: 1; }
.who { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-size: 14px; color: var(--p-muted); min-height: 44px; }
.who:hover { color: var(--p-ink); }
.ava { width: 32px; height: 32px; border-radius: 50%; background: var(--p-surface) center/cover; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--p-muted); overflow: hidden; }

/* ---------- layout ---------- */
main { max-width: 1160px; margin: 0 auto; padding: 40px 32px 88px; }
.grid { display: grid; grid-template-columns: minmax(0,1fr) 440px; grid-template-areas: "card pay"; column-gap: 72px; align-items: center; }
.a-card { grid-area: card; }
.a-pay { grid-area: pay; }

.eyebrow { font-size: 13px; color: var(--p-muted); margin: 0 0 10px; }
h1 { font: var(--display-weight) 40px/1.08 var(--font-display); letter-spacing: var(--display-tracking); margin: 0 0 28px; text-wrap: balance; }
h2 { font: 500 17px/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0 0 16px; }
.muted { color: var(--p-muted); }

/* ---------- the Premium card ---------- */
.pcard {
  position: relative; isolation: isolate; overflow: hidden;
  aspect-ratio: 1.586; width: 100%; max-width: 560px;
  border-radius: 22px; color: #fff; background: var(--deep);
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 30px 60px -30px rgba(10,26,82,.55), 0 18px 36px -18px rgba(0,0,0,.25);
  --bg: #0a1a52; --surface: #12267a; --ink: #ffffff; --muted: #aab6e6; --accent: #4f7bff; --accent-ink: #ffffff;
}
.pcard::after { /* the hairline edge of a real card */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
}
.pcard-in { position: absolute; inset: 0; padding: 26px 28px; display: flex; flex-direction: column; }
.pcard .top { display: flex; align-items: flex-start; justify-content: space-between; }
.pcard .brand { font: 500 20px/1 var(--font-display); letter-spacing: -0.02em; }
.pcard .brand small { display: block; margin-top: 6px; font: 400 13px/1 var(--font-text); letter-spacing: 0; color: #c7d0f2; }
.pcard .logo { width: 70px; height: 22px; }
.pcard .logo path[fill="white"] { fill: #fff; }
.pcard .bottom { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.pcard .name { font: 500 17px/1.2 var(--font-display); letter-spacing: .01em; }
.pcard .until { margin-top: 6px; font-size: 13px; color: #c7d0f2; }
.pcard .chip { font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 99px; background: rgba(255,255,255,.14); white-space: nowrap; }
.pcard.off { --bg: #2a2d36; --surface: #353945; --muted: #a0a4b0; --accent: #8b93a8; background: #2a2d36; }
.pcard.off .chip { background: rgba(255,255,255,.1); color: #d9dbe2; }

[data-enter] { animation: enter .9s var(--ease) both; }
[data-enter="2"] { animation-delay: .08s; }
[data-enter="3"] { animation-delay: .16s; }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } }

/* ---------- status line under the card ---------- */
.status { max-width: 560px; margin: 22px 0 0; }
.status-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.track { height: 4px; border-radius: 4px; background: var(--p-surface); margin-top: 10px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--p-accent); border-radius: inherit; transform-origin: left; animation: grow 1.2s .3s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }

/* ---------- what is in Premium: a band of feature cards (taste cards.md: card > lit panel > fragment) ---------- */
.feat-band { background: #f3f4f6; border-top: 1px solid var(--line); }
.feat-in { max-width: 1160px; margin: 0 auto; padding: 88px 32px 96px; }
.feat-head { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 32px; align-items: end; margin-bottom: 40px; }
.feat-head h2 { font: var(--display-weight) 36px/1.1 var(--font-display); letter-spacing: var(--display-tracking); margin: 0; text-wrap: balance; }
.feat-head p { margin: 0; font-size: 16px; line-height: 1.5; color: #2b2b2b; max-width: 46ch; justify-self: end; }
.bento { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.fcard { background: #fff; border: 1px solid rgba(17,17,17,.09); border-radius: 20px; padding: 32px 32px 0; display: flex; flex-direction: column; overflow: hidden; }
.fcard h3, .mini h3 { font: 500 19px/1.25 var(--font-display); letter-spacing: -0.015em; margin: 0 0 8px; }
.fcard p, .mini p { margin: 0; font-size: 16px; line-height: 24px; color: #2b2b2b; max-width: 46ch; min-height: 48px; }
.panel { --p-h: 290px; position: relative; isolation: isolate; height: var(--p-h); margin-top: 32px; border-radius: 12px 12px 0 0; overflow: hidden; }
.panel::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(17,17,17,.06); pointer-events: none; z-index: 3; }
/* soft lit fields in the «sky» family: one hue, the light from a different side in each panel */
.g1 { background: radial-gradient(110% 90% at 12% 0%, #eef3f8 0%, rgba(238,243,248,0) 58%), radial-gradient(90% 80% at 100% 100%, #a9bccf 0%, rgba(169,188,207,0) 70%), #c6d3df; }
.g2 { background: radial-gradient(100% 90% at 90% 0%, #eef3f8 0%, rgba(238,243,248,0) 55%), radial-gradient(90% 90% at 0% 100%, #a5b9cd 0%, rgba(165,185,205,0) 70%), #c9d5e0; }
.g3 { background: radial-gradient(120% 80% at 50% 0%, #f0f4f8 0%, rgba(240,244,248,0) 60%), radial-gradient(70% 80% at 100% 90%, #aabdd0 0%, rgba(170,189,208,0) 70%), #c6d3df; }
.g4 { background: radial-gradient(100% 100% at 0% 0%, #edf2f7 0%, rgba(237,242,247,0) 55%), radial-gradient(90% 70% at 80% 100%, #a7bacd 0%, rgba(167,186,205,0) 70%), #cbd6e1; }
.frag { position: absolute; z-index: 1; background: #fff; border: 1px solid rgba(17,17,17,.12); border-radius: 12px; font-size: 13px; line-height: 1.35; color: var(--p-ink);
  box-shadow: 0 1px 1px rgba(17,25,40,.04), 0 6px 14px -6px rgba(17,25,40,.12), 0 22px 40px -18px rgba(17,25,40,.22); }
.frag .meta { font-size: 12px; color: var(--p-muted); }
/* placements: corner (cut right and bottom), rise (cut bottom), right, low stack */
.at-corner { left: 32px; top: 36px; width: 460px; } /* runs past the panel's right edge only by the empty end of its rows */
.at-rise { left: 50%; transform: translateX(-50%); top: 40px; width: min(400px, calc(100% - 64px)); }
.at-right { right: 28px; top: 32px; width: min(360px, calc(100% - 56px)); }
.at-low { left: 32px; right: 32px; bottom: 32px; }

/* S10 Solo: the week of a plan */
.wk-h { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.wk-h b { font-weight: 500; }
.wk-r { display: grid; grid-template-columns: 22px 8px 136px minmax(0,1fr); gap: 10px; align-items: center; padding: 11px 16px; border-bottom: 1px solid #f0f0f2; }
.wk-r .d { color: var(--p-muted); font-size: 12px; }
.wk-r i { width: 8px; height: 8px; border-radius: 50%; }
.wk-r.on { background: #f3f6fe; box-shadow: inset 2px 0 0 var(--p-accent); }
.t-rec { background: #2e9e5b; } .t-dev { background: #2f6fdb; } .t-int { background: #f08a24; } .t-long { background: #d9443a; }

/* analysis: 80:20 */
.an { padding: 16px 18px 18px; }
.an-h { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.an-h b { font-weight: 500; }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.split i { display: block; }
.split .slow { background: #c3cfe6; } .split .fast { background: var(--p-accent); }
.leg { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--p-muted); }
.leg b { color: var(--p-ink); font-weight: 500; }
.spark { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.spark svg { display: block; width: 100%; height: 56px; margin-top: 8px; }

/* coach: a task, its report and the coach's comment */
.task { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.task-t { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.task-t i { width: 8px; height: 8px; border-radius: 50%; }
.task .meta { margin-top: 4px; }
.done { display: inline-block; margin-top: 8px; font-size: 12px; padding: 3px 8px; border-radius: 99px; background: #eef0f3; color: #2b2b2b; }
.cmt { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; padding: 14px 16px 16px; }
.cmt .av { width: 28px; height: 28px; border-radius: 50%; background: #e4e8ef; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #3d4a6b; }
.cmt .txt { border-left: 2px solid var(--p-accent); padding-left: 10px; }
.cmt .txt b { font-weight: 500; display: block; margin-bottom: 2px; }

/* Telegram: a short stack of notifications */
.ntf { display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 12px; padding: 14px 16px; border-bottom: 1px solid #f0f0f2; }
.ntf:last-child { border-bottom: 0; }
.ntf .tile { width: 36px; height: 36px; border-radius: 9px; background: #f4f6f9; display: grid; place-items: center; }
.ntf .tile img { width: 22px; height: 22px; display: block; }
.ntf .top { display: flex; justify-content: space-between; gap: 8px; }
.ntf .top b { font-weight: 500; }

/* the four smaller things */
.minis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-top: 16px; }
.mini { background: #fff; border: 1px solid rgba(17,17,17,.09); border-radius: 20px; padding: 28px; }
.mini h3 { margin-top: 20px; }
.mini p { font-size: 15px; line-height: 22px; min-height: 0; }
.mini .tiles { display: flex; gap: 8px; }
.mini .tl { width: 44px; height: 44px; border-radius: 12px; background: #f1f4f9; color: #24324f; display: grid; place-items: center; }
.mini .tl svg { width: 22px; height: 22px; }
.mini .tl img { width: 24px; height: 24px; display: block; }

/* ---------- the pay panel ---------- */
.pay {
  border: 1px solid var(--line); border-radius: var(--r-l); background: #fff; padding: 24px 26px;
  box-shadow: 0 1px 2px rgba(17,17,17,.04), 0 24px 48px -28px rgba(17,17,17,.18);
  display: flex; flex-direction: column;
}
#pay-body { flex: 1; display: flex; flex-direction: column; }
.pay-t { font: 500 22px/1.2 var(--font-display); letter-spacing: -0.02em; margin: 0 0 18px; }
.lbl { display: block; font-size: 13px; color: var(--p-muted); margin: 0 0 8px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--p-surface); border-radius: var(--r-m); margin-bottom: 18px; position: relative; }
.seg::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 6px); border-radius: 9px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 8px -2px rgba(0,0,0,.08); transition: transform .35s var(--ease); }
.seg[data-v="rub"]::before { transform: translateX(calc(100% + 4px)); }
.seg button { position: relative; z-index: 1; border: 0; background: none; min-height: 48px; border-radius: 9px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; color: var(--p-muted); transition: color .2s; }
.seg button b { font-weight: 500; font-size: 14px; color: inherit; }
.seg button small { font-size: 12px; }
.seg button[aria-pressed="true"] { color: var(--p-ink); }
.seg button:hover { color: var(--p-ink); }

.plans { display: grid; gap: 8px; margin-bottom: 14px; }
.plan { position: relative; display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-m); cursor: pointer; transition: border-color .2s, box-shadow .2s, background .2s; min-height: 60px; }
.plan:hover { border-color: #a9b9ec; }
.plan input { position: absolute; opacity: 0; pointer-events: none; }
.plan .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; transition: border-color .2s; }
.plan .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--p-accent); transform: scale(0); transition: transform .25s var(--ease); }
.plan:has(input:checked) { border-color: var(--p-accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.plan:has(input:checked) .dot { border-color: var(--p-accent); }
.plan:has(input:checked) .dot::after { transform: scale(1); }
.plan:has(input:focus-visible) { outline: 2px solid var(--p-accent); outline-offset: 2px; }
.plan b { font-weight: 500; display: block; }
.plan small { font-size: 13px; color: var(--p-muted); }
.plan .price { font-weight: 500; font-size: 16px; text-align: right; white-space: nowrap; }
.plan .price small { display: block; font-weight: 400; }

.switch { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.switch b { font-weight: 500; display: block; font-size: 14px; }
.switch small { font-size: 13px; color: var(--p-muted); display: block; }
.switch small a { color: var(--p-accent); }
.tg { position: relative; width: 44px; height: 26px; }
.tg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.tg i { position: absolute; inset: 0; border-radius: 99px; background: var(--line-strong); transition: background .25s; }
.tg i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .3s var(--ease); }
.tg input:checked + i { background: var(--p-accent); }
.tg input:checked + i::after { transform: translateX(18px); }
.tg input:focus-visible + i { outline: 2px solid var(--p-accent); outline-offset: 2px; }
.switch.is-off { opacity: .5; cursor: default; }
.switch.is-off .tg input { cursor: default; }

.field { padding: 12px 0 0; border-top: 1px solid var(--line); }
.field input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: #fff; transition: border-color .2s, box-shadow .2s; font-size: 16px; }
.field input:hover { border-color: #a9b9ec; }
.field input:focus { outline: none; border-color: var(--p-accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .err { display: none; color: #c4372c; font-size: 13px; margin-top: 6px; }
.field.bad input { border-color: #c4372c; }
.field.bad .err { display: block; }

.note { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 12px; padding: 14px 16px; margin-top: 4px; border-radius: var(--r-m); background: var(--accent-soft); color: var(--p-accent); font-size: 13px; line-height: 1.45; }
.note b { display: block; color: var(--p-ink); font-weight: 500; font-size: 14px; margin-bottom: 2px; }
.note span { color: #3d4a6b; }
.sum { margin-top: auto; padding-top: 16px; }
.sum-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--p-muted); padding: 4px 0; }
.sum-row.total { color: var(--p-ink); font-size: 16px; font-weight: 500; padding-top: 12px; margin-top: 8px; border-top: 1px solid var(--line); }
.sum-row.total b { font: 500 22px/1 var(--font-display); letter-spacing: -0.02em; }

.go {
  margin-top: 18px; width: 100%; min-height: 54px; border: 0; border-radius: var(--r-m); cursor: pointer;
  background: var(--p-action); color: var(--p-action-ink); font-weight: 500; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 8px 20px -8px rgba(26,75,224,.6);
  transition: background .2s, transform .15s var(--ease), box-shadow .2s;
}
.go:hover { background: #163fc0; transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 12px 24px -10px rgba(26,75,224,.7); }
.go:active { transform: translateY(1px) scale(.995); box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 4px 10px -6px rgba(26,75,224,.6); }
.go[disabled] { opacity: .6; cursor: progress; }
.fine { margin: 12px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--p-muted); display: flex; gap: 8px; align-items: flex-start; }
.fine svg { flex: none; margin-top: 2px; }
.fine a { color: inherit; }

footer { max-width: 1160px; margin: 0 auto; padding: 28px 32px 40px; position: relative; display: flex; gap: 8px 24px; flex-wrap: wrap; font-size: 13px; color: var(--p-muted); }
footer::before { content: ""; position: absolute; top: 0; left: 32px; right: 32px; border-top: 1px solid var(--line); }
@media (max-width: 860px) { footer::before { left: 20px; right: 20px; } }
footer a { text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
footer a:hover { color: var(--p-ink); text-decoration: underline; text-underline-offset: 3px; }
footer .sp { flex: 1; }

.demo-note { font-size: 12px; color: var(--p-muted); background: var(--p-surface); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.demo-note a { color: var(--p-accent); margin-left: 6px; }
@media (max-width: 560px) { .demo-note { display: none; } }

/* ---------- smaller screens ---------- */
@media (max-width: 1080px) {
  .grid { grid-template-columns: minmax(0,1fr) 400px; column-gap: 40px; }
  .minis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .at-corner { width: 480px; }
}
@media (max-width: 860px) {
  main { padding: 28px 20px 64px; }
  .bar-in, footer { padding-left: 20px; padding-right: 20px; }
  .grid { grid-template-columns: minmax(0,1fr); grid-template-areas: "card" "pay"; }
  .a-pay { margin-top: 32px; }
  .feat-in { padding: 56px 20px 64px; }

/* ================= data =================
   { me, today, paidUntil (iso | null), autopay (bool | null), eur: {m1}, rub: {m1, m12}, email } */
const RU_DATE = /(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+(\d{4})/;
const ruDate = (s) => { const m = RU_DATE.exec(s || ''); return m ? `${m[3]}-${String(MON.indexOf(m[2]) + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}` : null; };

async function loadLive() {
  const j = (u) => fetch(u, { credentials: 'include' }).then((r) => r.json());
  const page = (u) => fetch(u, { credentials: 'include' }).then((r) => r.ok ? r.text() : '').then((t) => new DOMParser().parseFromString(t, 'text/html')).catch(() => null);
  const me = await j('/apiweb/student/self/info/').catch(() => null);
  if (!me?.id) return { me: null };
  const today = iso(new Date(((me.nowmsk || Date.now() / 1000) + 3 * 3600) * 1000));
  const [eurDoc, rubDoc] = await Promise.all([page('/money_stripe'), page('/money2')]);
  const text = (d) => (d?.body?.textContent || '').replace(/\s+/g, ' ');
  const T = text(eurDoc), R = text(rubDoc);
  const paidUntil = ruDate((/оплачено до ([^.]*?\d{4})/i.exec(T) || /оплачено до ([^.]*?\d{4})/i.exec(R) || [])[1]);
  const autopay = /автоматический платеж не подключен/i.test(T + R) ? false : /автоматический платеж подключен/i.test(T + R) ? true : null;
  const eurM1 = parseFloat(((/Стоимость сервисов\s*([\d.,]+)\s*EUR/i.exec(T) || [])[1] || '9').replace(',', '.'));
  const rubM1 = +((/1 месяц\s*-\s*([\d\s]+)\s*руб/i.exec(R) || [])[1] || '750').replace(/\s/g, '');
  const rubM12 = +((/12 месяцев\s*-\s*([\d\s]+)\s*руб/i.exec(R) || [])[1] || '9000').replace(/\s/g, '');
  const email = rubDoc?.querySelector('input[name=email]')?.value || '';
  return { me, today, paidUntil, autopay, eur: { m1: eurM1 }, rub: { m1: rubM1, m12: rubM12 }, email };
}

      <article class="mini"><div class="tiles"><span class="tl"><img src="icons/app-store.svg" alt="App Store"></span><span class="tl"><img src="icons/google-play.svg" alt="Google Play"></span></div><h3>Приложения</h3><p>S10.run для iOS и Android.</p></article>
    </div>
  </div></section>`;
}

async function start() {
  /*<demo>*/ if (!LIVE) return render(loadDemo()); /*</demo>*/
  const data = await loadLive();
  if (!data.me) { location.href = '/login?back=' + encodeURIComponent(location.pathname); return; }
  render(data);
}

function render(D) {
  const st = { cur: Q.get('cur') === 'rub' ? 'rub' : 'eur', period: 1, autopay: true }; // on, as the old Stripe page had it
  const name = [D.me.firstName, D.me.lastName].filter(Boolean).join(' ') || 'Спортсмен S10';
  const active = !!(D.paidUntil && D.paidUntil >= D.today);
  const daysLeft = active ? Math.round((d8(D.paidUntil) - d8(D.today)) / 864e5) : 0;
  const initials = name.split(/\s+/).map((x) => x[0]).join('').slice(0, 2).toUpperCase();

  $('#app').innerHTML = `
  <header class="bar"><div class="bar-in">
    <a class="back" href="/">${I.back}<span>На S10.run</span></a>
    <span class="sp"></span>
    ${LOGO}
    <span class="sp"></span>
    ${LIVE ? '' : `<span class="demo-note">Демо<a href="?${Q.has('free') ? '' : 'free'}">${Q.has('free') ? 'с Premium' : 'без Premium'}</a></span>`}
    <a class="who" href="/profile?${esc(D.me.id)}"><span>${esc(name)}</span><span class="ava" ${D.me.avatarUrl ? `style="background-image:url('${esc(D.me.avatarUrl)}')"` : ''}>${D.me.avatarUrl ? '' : esc(initials)}</span></a>
  </div></header>

  <main id="main">
    <div class="grid">
      <section class="a-card" aria-labelledby="h1">
        <p class="eyebrow">${active ? 'Ваша подписка' : 'Подписка S10.run'}</p>
        <h1 id="h1">${active ? 'Продлить S10 Premium' : 'Подключить S10 Premium'}</h1>
        <div class="pcard${active ? '' : ' off'}" data-enter data-fx="orb-sphere" data-fx-seed="1003"
          data-fx-params='{"size":0.46,"orbX":0.86,"orbY":0.42,"calmX":0.2,"calmY":0.5,"calm":0.6,"glow":0.5,"rim":0.9,"stars":70,"speed":0.04}'>
          <div class="pcard-in">
            <div class="top"><div class="brand">Premium<small>S10.run</small></div></div>
            <div class="bottom">
              <div><div class="name">${esc(name)}</div><div class="until">${active ? `Оплачено до ${longDate(D.paidUntil)}` : D.paidUntil ? `Закончился ${longDate(D.paidUntil)}` : 'Не подключён'}</div></div>
              <span class="chip">${active ? (D.autopay ? 'Автопродление' : 'Активен') : 'Не активен'}</span>
            </div>
          </div>
        </div>
        <div class="status" data-enter="2">
          ${active ? `<div class="status-row"><span>Осталось ${daysLeft} ${plural(daysLeft, 'день', 'дня', 'дней')}</span><span class="muted">${D.autopay ? 'продлится автоматически' : 'автопродление не подключено'}</span></div>
          <div class="track" aria-hidden="true"><i style="width:${Math.min(100, Math.max(3, (daysLeft / 365) * 100))}%"></i></div>`
          : `<div class="status-row"><span>Premium сейчас не активен</span><span class="muted">${D.paidUntil ? `был до ${longDate(D.paidUntil)}` : ''}</span></div>`}
        </div>
      </section>

      <aside class="a-pay" id="pay" aria-labelledby="pay-h" data-enter="2">
        <form class="pay" id="pay-form" method="get" novalidate>
          <div class="pay-t" id="pay-h">Оплата</div>
          <span class="lbl" id="cur-l">Валюта и способ</span>
          <div class="seg" role="group" aria-labelledby="cur-l" data-v="${st.cur}">
            <button type="button" data-cur="eur" aria-pressed="${st.cur === 'eur'}"><b>Евро</b><small>картой · Stripe</small></button>
            <button type="button" data-cur="rub" aria-pressed="${st.cur === 'rub'}"><b>Рубли</b><small>Т-Банк</small></button>
          </div>
          <div id="pay-body"></div>
        </form>
      </aside>

    </div>
  </main>
${featBand()}
  <footer>
    <a href="/about" target="_blank" rel="noopener">Условия использования</a>
    <a href="/tilda/85144/offer_tinkoff" target="_blank" rel="noopener">Соглашение о рекуррентных списаниях</a>
    <a href="https://t.me/+wP4aOZ4910I2MTk6" target="_blank" rel="noopener">Вопросы в Telegram</a>
    <span class="sp"></span>
    <span>© 2010–2026 S10.run</span>
  </footer>
  `;

  const form = $('#pay-form'), body = $('#pay-body'), seg = $('.seg');

  function drawPay() {
    const eur = st.cur === 'eur';
    if (eur) st.period = 1;
    const price = eur ? D.eur.m1 : st.period === 12 ? D.rub.m12 : D.rub.m1;
    const recurOk = eur || st.period === 1; // the old RUB page offers autopay with the monthly payment only
    const perMonth12 = Math.round(D.rub.m12 / 12);
    body.innerHTML = `
      <span class="lbl">Срок</span>
      <div class="plans" role="radiogroup" aria-label="Срок">
        <label class="plan"><input type="radio" name="period" value="1" ${st.period === 1 ? 'checked' : ''}><span class="dot"></span>
          <span><b>1 месяц</b><small>${eur ? 'Все функции Premium' : 'Зачисление мгновенно'}</small></span>
          <span class="price">${money(eur ? D.eur.m1 : D.rub.m1, st.cur)}<small>в месяц</small></span></label>
        ${eur ? '' : `<label class="plan"><input type="radio" name="period" value="12" ${st.period === 12 ? 'checked' : ''}><span class="dot"></span>
          <span><b>12 месяцев</b><small>Одним платежом</small></span>
          <span class="price">${money(D.rub.m12, 'rub')}<small>${money(perMonth12, 'rub')} в месяц</small></span></label>`}
      </div>
      <label class="switch${recurOk ? '' : ' is-off'}">
        <span><b>Продлевать автоматически</b>
          <small>${recurOk ? `${money(price, st.cur)} раз в месяц` : 'Для оплаты за год автопродления нет'}${!eur && recurOk ? ` · <a href="/tilda/85144/offer_tinkoff" target="_blank" rel="noopener">соглашение</a>` : ''}</small></span>
        <span class="tg"><input type="checkbox" id="recur" ${st.autopay && recurOk ? 'checked' : ''} ${recurOk ? '' : 'disabled'} aria-label="Продлевать автоматически"><i></i></span>
      </label>
      ${eur ? `<div class="note">${I.card}<span><b>Карту введёте на странице Stripe</b>Оплата откроется на защищённой странице. S10.run данные карты не видит и не хранит.</span></div>` : `<div class="field" id="mail-f">
        <label class="lbl" for="mail">Почта <span class="muted">· её просит Т-Банк</span></label>
        <input id="mail" type="email" autocomplete="email" inputmode="email" value="${esc(D.email)}" required>
        <div class="err" id="mail-e">Нужна почта: без неё Т-Банк не примет платёж</div></div>`}
      <div class="sum">
        <div class="sum-row"><span>Premium, ${st.period === 12 ? '12 месяцев' : '1 месяц'}</span><span>${money(price, st.cur)}</span></div>
        <div class="sum-row total"><span>К оплате сегодня</span><b>${money(price, st.cur)}</b></div>
        <button class="go" type="submit">${I.lock}<span>Оплатить ${money(price, st.cur)}</span></button>
        <p class="fine">${I.lock}<span>${eur ? 'Защищённая оплата через Stripe.' : 'Защищённая оплата через Т-Банк, зачисление мгновенно.'} Деньги за Premium не возвращаются.</span></p>
      </div>`;
    body.querySelectorAll('input[name=period]').forEach((r) => r.addEventListener('change', () => { st.period = +r.value; drawPay(); body.querySelector(`input[name=period][value="${st.period}"]`)?.focus(); }));
    $('#recur').addEventListener('change', (e) => { st.autopay = e.target.checked; drawPay(); $('#recur').focus(); });
    const mail = $('#mail'); if (mail) mail.addEventListener('input', () => { D.email = mail.value; $('#mail-f').classList.remove('bad'); });
  }
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-cur]'); if (!b || b.dataset.cur === st.cur) return;
    st.cur = b.dataset.cur; seg.dataset.v = st.cur;
    seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.cur === st.cur)));
    drawPay();
  });
  // the panel keeps the height of its tallest state (₽, with the e-mail), so «Оплатить» never moves on a click
  function fitHeight() {
    const keep = { cur: st.cur, period: st.period };
    form.style.minHeight = '';
    Object.assign(st, { cur: 'rub', period: 1 }); drawPay();
    const h = form.offsetHeight;
    Object.assign(st, keep); drawPay();
    form.style.minHeight = matchMedia('(min-width: 861px)').matches ? h + 'px' : ''; // a phone has the button below anyway
  }
  fitHeight();
  let rz, lastW = innerWidth; // width only: a phone's keyboard and toolbar change the height while typing
  addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(fitHeight, 150); });

  // «Оплатить»: the same GET the old pages send, so the server needs no change
  //   € (Stripe): /money_stripe?paysite=1[&siterecur=1]
  //   ₽ (Т-Банк): /money2?email=…&paysite=1[&recur=1][&paymonth12=1]
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const p = new URLSearchParams();
    let url;
    if (st.cur === 'eur') {
      url = '/money_stripe'; p.set('paysite', '1'); if (st.autopay) p.set('siterecur', '1');
    } else {
      const m = $('#mail');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.value.trim())) { $('#mail-f').classList.add('bad'); m.setAttribute('aria-describedby', 'mail-e'); m.focus(); return; }
      url = '/money2'; p.set('email', m.value.trim()); p.set('paysite', '1');
      if (st.period === 12) p.set('paymonth12', '1'); else if (st.autopay) p.set('recur', '1');
    }
    const go = $('.go'); go.disabled = true;
    /*<demo>*/ if (!LIVE) { go.querySelector('span').textContent = `Демо: ${url}?${p}`.replace(/email=[^&]+/, 'email=…'); setTimeout(() => drawPay(), 2600); return; } /*</demo>*/
    location.href = `${url}?${p}`;
  });

  fx.mountAll(document);
}

start();
</script>
</body>
</html>
