<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Моя неделя · S10.run (демо)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#f4f4f4}</style>
</head>
<body>
<noscript>Включите JavaScript, чтобы увидеть демо.</noscript>
<script src="fixtures.js"></script>
<script>
// ?newbie: the same demo as someone who has just signed up (no main race, no plans, no S10 forecast, empty diary),
// starting afresh on every visit; ?newbie&free also without premium. Demo only: nothing is sent to S10.
(() => {
  const q = new URLSearchParams(location.search); if (!q.has('newbie')) return;
  const x = window.S10_FIXTURES;
  x.main = { main: null }; x.versions = []; x.library = []; x.results = []; x.startParam = { param: {} }; x.diary.diaryTasksInfo = [];
  x.me.firstName = 'Новый'; x.me.lastName = 'спортсмен'; if (q.has('free')) x.me.isPremium = false;
  try { Object.keys(localStorage).filter((k) => k.startsWith('s10week.')).forEach((k) => localStorage.removeItem(k)); } catch { /* storage blocked */ }
})();
</script>
<script src="../solo.js"></script>
</body>
</html>
